paths:
  acc: ../../../accessories/
  data_ext: ../../../data/external/
  data_intrm: ../../../data/interim/
  data_proc: ../../../data/processed/
  data_raw: ../../../data/raw/
  models: ../../../models/
  figures: ../../../reports/figures/
  tables: ../../../reports/tables/
  vals: ../../../reports/values/


plotting:
  base_size: 16 # Base size of plotting objects
  leg_mkr_size: 1 # Legend marker size
  line_width: 1 # Line width
  mkr_size: 8 # Marker size
  ax_line_width: 0.8  # Axes line width
  xtick_maj_width: 0.8 # Xticks major width
  ytick_maj_width: 0.8 # Yticks major width
  xtick_maj_size: 3.5 # Xticks major size
  ytick_maj_size: 3.5 # Yticks major size
  font_family: sans-serif # Font family

sampling:
  # Normal means problem, multiple regression problem, and real-data example
  hdi: 0.95 # Highest density interval
  n_chains: 4 # Number of chains
  n_draws: 5000 # Number of draws per chain
  n_tune: 2000 # Number of tuning steps (burn-in) per chain
  n_cores: 4 # Number of cores
  targ_acpt: 0.85 # Acceptance probability
  vi_n_iter: 25000 # Number of iterations for variational inference
  vi_n_draws: 10000 # Number of draws for variational inference

scraping:
  headless: False # Do not show browser window
  crawl_till: "2023-11-28 09:00:00"
  repeat_per: 9 # Period in hours during which matches are crawled
                # before new tournaments are crawled
  sleep: 3 # Hours to sleep between repeats
