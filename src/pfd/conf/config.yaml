defaults: # Entries below _self_ override the config in this file
  - sampling: fast_sampling
  - general: alt_seed
  - _self_ 
  - override hydra/job_logging: custom

estimation:
  spec: BmHome # Which odds to use for analysis
  compets: null # Which competitions ["ATP", "WTA"] or null
  bm_quantile: 0.25  # Quantile selecting the bookmakers by the number of obs.
  odds_mvmnts: [2, 20] # Minimum and maximum of odds movements
  ts_dur: [12, 72] # Min and max time series duration in hours
  period: Null  # Subperiod in hours of the time series to keep (e.g., last 12)
  resample_freq: 1min # Frequency (min) to which the series is resampled
  pctl: 2  # Percentile time increments
  incr: 5 # Incremental step for periods for GMM estimation
  max_iter: "cue" # Maximum number of iterations for GMM

files:
  clr_plt: stata_colors.json # Color palette
  chrm_driv: chromedriver.exe  # Chrome driver
  acpt_cookies: I-don-t-care-about-cookies.crx # Accept cookies
  cred: credentials.json  # Credentials
  vals: values.dat  # Values

general:
  seed: 42
  save: True # Save objects boolean
  main_scripts: [
        shape_data.py,
        run_estimation.py,
        run_descriptives.py,
    ]

# paths:  # TODO
#   acc: ${hydra:runtime.cwd}/../../accessories/
