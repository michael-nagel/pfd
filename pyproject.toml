[project]
name = "pfd"
version = "0.1.0"
description = "Replication package for 'Price Formation Dynamics and Learning'"
authors = [
  { name = "Michael Nagel", email = "michael.n.nagel@gmail.com" },
]
maintainers = [
  { name = "Michael Nagel", email = "m.nagel@uni-tuebingen.de" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.12"
keywords = ["gmm", "bayesian estimation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "arch==7.0.0",
  "arviz==0.16.1",
  "fake-useragent==1.4.0",
  "fastprogress==1.0.3",
  "h5py==3.10.0",
  "hydra-core==1.3.2",
  "matplotlib==3.8.2",
  "numba==0.58.1",
  "numpy==1.26.2",
  "nutpie==0.9.1",
  "omegaconf==2.3.0",
  "pandas==2.2.1",
  "pymc==5.10.1",
  "rpy2==3.6.7",
  "scikit-learn==1.3.2",
  "scipy==1.11.4",
  "seaborn==0.13.0",
  "selenium==4.16.0",
  "statsmodels==0.14.0",
  "tables==3.9.2",
]

[project.urls]
Homepage = "https://taylor-francis-paper-url"
Repository = "https://repo-url"
Changelog = "https://repo-url/CHANGELOG.rst"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]
docs = [
    "esbonio>=2.1.0",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfd"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/pfd/data/_crawl_data.py" = ["E722"]
"src/pfd/utils/login.py" = ["E722"]
"docs/conf.py" = ["E402"]

[tool.ty.environment]
python-version = "3.11"

# Downgraded rather than fixed: the remaining diagnostics come from
# incomplete/loose stubs in pymc, pytensor, arviz and pandas (e.g. the
# `SequenceNotStr` protocol pandas expects for `columns=`/`index=`, or
# pymc's untyped Distribution/MutableData API), not from bugs in this
# code. The old mypy config disabled the equivalent categories
# (assignment, attr-defined, misc, index, union-attr) project-wide for
# the same reason; this mirrors that stance for `ty`.
[tool.ty.rules]
invalid-argument-type = "warn"
unresolved-attribute = "warn"
invalid-assignment = "warn"
not-subscriptable = "warn"
no-matching-overload = "warn"
unknown-argument = "warn"
missing-argument = "warn"
invalid-return-type = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pfd"]
branch = true
