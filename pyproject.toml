[project]
name = "pfd"
version = "0.1.0"
description = "Replication package for 'Price Formation Dynamics and Learning'"
authors = [{name = "Michael Nagel", email = "michael.n.nagel@gmail.com"}]
maintainers = [{name = "Michael Nagel", email = "m.nagel@uni-tuebingen.de"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["gmm", "bayesian estimation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows"
]


[project.urls]
Homepage = "https://taylor-francis-paper-url"
Repository = "https://repo-url"
Documentation = "https://python-poetry.org/docs"
Changelog = "https://repo-url/CHANGELOG.rst"

# Tell uv where your source code is
[tool.uv]
dev-dependencies = [
    "Sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
    "tox>=4.11.4",
    "pytest>=7.4.4",
    "pytest-sugar>=0.9.7",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0",
    "esbonio>=0.16.04",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
