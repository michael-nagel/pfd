[tool.poetry]
name = "pfd"
version = "0.1.0"
description = "Replication package for 'Price Formation Dynamics and Learning'"
authors = ["Michael Nagel <michael.n.nagel@gmail.com>"]
maintainers = ["Michael Nagel <m.nagel@uni-tuebingen.de>"]
license = "MIT"
readme = ["README.md", "LICENSE"]
packages = [
  {include = "pfd", from = "src"}
]
homepage = "https://taylor-francis-paper-url"
repository = "https://repo-url"
documentation = "https://python-poetry.org/docs"
keywords = [
  "gmm", 
  "bayesian estimation"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows"
]

[tool.poetry.urls]
Changelog = "https://repo-url/CHANGELOG.rst"

[tool.poetry.dependencies]
python = "~3.11"
arviz = "0.16.1"
fake_useragent = "1.4.0"
matplotlib = "3.8.2"
numba = "0.58.1"
numpy = "1.26.2"
nutpie = "0.9.1"
pandas = "2.1.4"
pymc = "5.10.1"
requests = "2.31.0"
scikit-learn = "1.3.2"
scipy = "1.11.4"
seaborn = "0.13.0"
selenium = "4.16.0"
statsmodels = "0.14.0"
conda-lock = "2.5.1"
sphinx-rtd-theme = "2.0.0"
jinja2 = "3.1.3"
h5py = "3.10.0"
tables = "3.9.2"
hydra-core = "1.3.2"
stubs = "1.0.0"

[tool.poetry.group.dev.dependencies]
Sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"
tox = "^4.11.4"
pytest = "^7.4.4"
pytest-sugar = "^0.9.7"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pytest-cov = "^4.1.0"
esbonio = "^0.16.04"

[[tool.mypy.overrides]]
module = [
  "pandas",
  "scipy.integrate",
  "scipy.stats",
  "pymc",
  "seaborn",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
